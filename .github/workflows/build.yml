name: Build and Package Desktop App
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-desktop:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows"
            os: windows-latest
            package-type: "msi"
          - platform: "macos"
            os: macos-latest
            package-type: "dmg"
          - platform: "linux"
            os: ubuntu-latest
            package-type: "deb"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies (Linux Only)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libgtk-3-dev

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Install Pre-compiled Dioxus CLI
        shell: bash
        run: |
          curl -fsSL https://dioxuslabs.com | bash
          echo "$HOME/.dioxus/bin" >> $GITHUB_PATH

      - name: Debug and Bundle Application
        shell: bash
        run: |
          echo "=== Current Root Workspace Directory ==="
          pwd
          ls -la
          
          if [ -d "media-player-main" ]; then
            echo "-> Found 'media-player-main' directory. Entering folder..."
            cd media-player-main
          elif [ -d "media-player" ]; then
            echo "-> Found 'media-player' directory. Entering folder..."
            cd media-player
          else
            echo "-> No nested application subfolders found. Bundling directly from root workspace..."
          fi
          
          echo "=== Launching Dioxus Compiler Core ==="
          dx bundle --release --package-types ${{ matrix.package-type }}

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: media-player-${{ matrix.platform }}
          # FIX: Explicit recursive folder path tracking ensures the actions uploader
          # inspects target directories nested deep within subfolders.
          path: |
            **/target/dx/**/release/bundle/msi/*.msi
            **/target/dx/**/release/bundle/dmg/*.dmg
            **/target/dx/**/release/bundle/deb/*.deb
