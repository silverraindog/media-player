name: Build and Package Desktop App
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-desktop:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # We leverage native runners for each OS to handle native code compilation
        include:
          - platform: "windows"
            os: windows-latest
            package-type: "msi"
          - platform: "macos"
            os: macos-latest
            package-type: "dmg"
          - platform: "linux"
            os: ubuntu-latest
            package-type: "deb"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies (Linux Only)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          # Dioxus Desktop uses webkit2gtk on Linux. 
          # libssl-dev handles native secure sockets (Samba, encryption).
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libgtk-3-dev

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Install Dioxus CLI
        # Installs 'dx', the unified command-line pipeline manager for Dioxus
        run: cargo install dioxus-cli

      - name: Bundle Desktop Application
        # Compiles the Rust backend, optimization passes, and packages native assets
        run: dx bundle --release --package-types ${{ matrix.package-type }}

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: media-player-${{ matrix.platform }}
          # Dioxus outputs grouped bundle installers to target/dx/
          path: |
            target/dx/*/release/bundle/msi/*.msi
            target/dx/*/release/bundle/dmg/*.dmg
            target/dx/*/release/bundle/deb/*.deb
