[package]
name = "sambavault-tauri"
version = "0.0.2"
description = "SambaVault high-performance media scanner in Rust"
authors = ["SambaVault Team"]
edition = "2021"

[dependencies]
tauri = { version = "1.5", features = ["api-all"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(target_os = "macos")'.dependencies]
vlc-rs = "0.3"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]