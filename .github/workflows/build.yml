name: Build and Package Desktop App
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-desktop:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows"
            os: windows-latest
            package-type: "msi"
          - platform: "macos"
            os: macos-latest
            package-type: "dmg"
          - platform: "linux"
            os: ubuntu-latest
            package-type: "deb"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies (Linux Only)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libgtk-3-dev pkg-config

      - name: Install OpenSSL 3 (macOS Only)
        if: matrix.platform == 'macos'
        run: |
          # Provision the exact missing dynamic link library the pre-built dx binary expects
          brew install openssl@3
          echo "DYLD_LIBRARY_PATH=$(brew --prefix openssl@3)/lib:$DYLD_LIBRARY_PATH" >> $GITHUB_ENV

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Install Pre-compiled Dioxus CLI natively
        shell: bash
        run: |
          cargo install cargo-binstall
          cargo binstall -y dioxus-cli --version 0.6.3

      - name: Debug and Bundle Application
        shell: bash
        run: |
          echo "=== Current Root Workspace Directory ==="
          pwd
          ls -la
          
          if [ -d "media-player-main" ]; then
            echo "-> Found 'media-player-main' directory. Entering folder..."
            cd media-player-main
          elif [ -d "media-player" ]; then
            echo "-> Found 'media-player' directory. Entering folder..."
            cd media-player
          else
            echo "-> No nested application subfolders found. Bundling directly from root workspace..."
          fi
          
          echo "=== Launching Dioxus Compiler Core ==="
          dx bundle --release --package-types ${{ matrix.package-type }}

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: media-player-${{ matrix.platform }}
          path: |
            **/target/dx/**/*.msi
            **/target/dx/**/*.dmg
            **/target/dx/**/*.deb
