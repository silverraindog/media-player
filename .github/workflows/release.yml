name: Release Desktop App

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+*'
      - '*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Specific version tag to release (e.g. 0.0.1, 0.0.2). If omitted, auto-increments the latest tag.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  determine-version:
    name: Determine Release Version Tag
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.calc_ver.outputs.version }}
      release_tag: ${{ steps.calc_ver.outputs.tag }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Calculate Next Version Tag
        id: calc_ver
        shell: bash
        run: |
          # 1. Direct tag push (e.g., git push origin 0.0.1 or v0.0.1)
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            RAW_TAG="${{ github.ref_name }}"
            CLEAN_VERSION="${RAW_TAG#v}"
            echo "version=${CLEAN_VERSION}" >> $GITHUB_OUTPUT
            echo "tag=${RAW_TAG}" >> $GITHUB_OUTPUT
            echo "Triggered by git tag: ${RAW_TAG} (version: ${CLEAN_VERSION})"
            exit 0
          fi

          # 2. Manual workflow dispatch with custom version input
          EXPLICIT_VERSION="${{ github.event.inputs.version }}"
          if [[ -n "${EXPLICIT_VERSION}" ]]; then
            CLEAN_VERSION="${EXPLICIT_VERSION#v}"
            echo "version=${CLEAN_VERSION}" >> $GITHUB_OUTPUT
            echo "tag=${EXPLICIT_VERSION}" >> $GITHUB_OUTPUT
            echo "Using manual input version: ${EXPLICIT_VERSION}"
            
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "${EXPLICIT_VERSION}" || true
            git push origin "${EXPLICIT_VERSION}" || true
            exit 0
          fi

          # 3. Push to main: automatically increment version tag (e.g., 0.0.1 -> 0.0.2 -> etc)
          git fetch --tags --force origin 2>/dev/null || true
          
          # Find latest semver tag (either 0.0.1 or v0.0.1)
          # We use || true to prevent grep from failing the script if no tags match
          LATEST_TAG=$(git tag -l | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || echo "")
          
          if [[ -z "$LATEST_TAG" ]]; then
            echo "No existing semver tags found. Checking package.json..."
            PKG_VER=$(node -p "try { require('./package.json').version } catch(e){'0.0.1'}" || echo "0.0.1")
            if [[ "$PKG_VER" == "0.0.0" || -z "$PKG_VER" ]]; then
              NEXT_VERSION="0.0.1"
            else
              NEXT_VERSION="$PKG_VER"
            fi
          else
            CLEAN_LATEST="${LATEST_TAG#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CLEAN_LATEST"
            PATCH=$((PATCH + 1))
            NEXT_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          fi

          NEXT_TAG="${NEXT_VERSION}"
          echo "Automated sequential version: ${NEXT_VERSION} (Tag: ${NEXT_TAG})"
          echo "version=${NEXT_VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${NEXT_TAG}" >> $GITHUB_OUTPUT

          # Create git tag on GitHub so commit is officially tagged
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${NEXT_TAG}" || true
          git push origin "${NEXT_TAG}" || echo "Tag push skipped or already exists on origin"

  release-desktop:
    name: Release (${{ matrix.platform }})
    needs: determine-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows"
            os: windows-latest
          - platform: "macos"
            os: macos-latest
          - platform: "linux"
            os: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Clean Lockfile for Fresh Cross-Platform Resolution
        shell: bash
        run: rm -f bun.lock bun.lockb yarn.lock pnpm-lock.yaml package-lock.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Sync App Configuration to Release Version
        shell: bash
        run: |
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          node scripts/sync-version.cjs "${{ needs.determine-version.outputs.release_version }}" "${{ github.sha }}" "$BUILD_DATE"

      - name: Generate Release Notes
        id: notes
        shell: bash
        run: |
          # Use a temporary file to avoid issues with special characters in bash variables
          node scripts/get-release-notes.cjs "${{ needs.determine-version.outputs.release_version }}" > release_notes.md
          
          # Set the output using the new environment file method for multi-line strings
          echo "release_notes<<EOF" >> $GITHUB_OUTPUT
          cat release_notes.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Install System Dependencies (Linux Only)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Frontend Dependencies
        run: npm install --include=optional --force

      - name: Build and Release Desktop App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: "./"
          tagName: ${{ needs.determine-version.outputs.release_tag }}
          releaseName: 'SambaVault ${{ needs.determine-version.outputs.release_tag }}'
          releaseBody: ${{ steps.notes.outputs.release_notes }}
          releaseDraft: false
          prerelease: false
