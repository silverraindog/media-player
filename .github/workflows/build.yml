name: Build and Package Desktop App
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-desktop:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows"
            os: windows-latest
            package-type: "msi"
          - platform: "macos"
            os: macos-latest
            package-type: "dmg"
          - platform: "linux"
            os: ubuntu-latest
            package-type: "deb"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies (Linux Only)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libgtk-3-dev

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Install Pre-compiled Dioxus CLI
        shell: bash
        run: |
          cargo install cargo-binstall
          cargo binstall -y dioxus-cli --version 0.6.0-alpha.5

      - name: Bundle Desktop Application
        # Explicit directory targeting relative to the checked-out root
        working-directory: media-player-main
        run: dx bundle --release --package-types ${{ matrix.package-type }}

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: media-player-${{ matrix.platform }}
          path: |
            media-player-main/target/dx/media-player-rust/release/bundle/msi/*.msi
            media-player-main/target/dx/media-player-rust/release/bundle/dmg/*.dmg
            media-player-main/target/dx/media-player-rust/release/bundle/deb/*.deb
