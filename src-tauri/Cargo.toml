[package]
name = "sambavault-tauri"
version = "1.0.0"
description = "SambaVault high-performance media scanner in Rust"
authors = ["SambaVault Team"]
edition = "2021"

[dependencies]
tauri = { version = "1.5", features = ["all"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5"
tokio = { version = "1.0", features = ["full"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
