name: Auto Pull Request

on:
  push:
    branches-ignore:
      - main
      - master
      - create-pull-request/**

jobs:
  build-and-create-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Compile and Build Project
        run: npm run build

      - name: Create or Update Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: Automated sync update
          title: Automated Changes Sync
          body: |
            Automated Pull Request generated by GitHub Actions when code changes are pushed.
            - Reviews tests, linting, and builds automatically.
          base: main
          delete-branch: true
          signoff: false
