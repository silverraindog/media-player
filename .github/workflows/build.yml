name: Build and Package Desktop App
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  startup-smoke-test:
    name: Browser Startup Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install Frontend Dependencies
        run: npm install --include=optional --force --no-package-lock

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Browser Startup Smoke Test
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload Browser Diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: startup-smoke-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  build-desktop:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows"
            os: windows-latest
          - platform: "macos"
            os: macos-latest
          - platform: "linux"
            os: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Clean Lockfile for Fresh Cross-Platform Resolution
        shell: bash
        run: rm -f bun.lock bun.lockb yarn.lock pnpm-lock.yaml package-lock.json

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Determine Version
        id: ver
        shell: bash
        run: |
          echo "🔍 Extracting version from package.json..."
          VERSION=$(node -p "require('./package.json').version")
          echo "✅ Version detected: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "🔄 Synchronizing all config files to $VERSION (Commit: ${{ github.sha }}, Date: $BUILD_DATE)..."
          node scripts/sync-version.cjs "$VERSION" "${{ github.sha }}" "$BUILD_DATE"
          echo "✨ Synchronization complete."

      - name: Install System Dependencies (Linux Only)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev ffmpeg

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Frontend Dependencies
        run: npm install --include=optional --force

      - name: Run Quality Verification and Loop-Immunity Tests
        run: npm test

      - name: Install FFmpeg (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          choco install ffmpeg --yes --no-progress
          $toolsPath = Join-Path $env:ChocolateyInstall 'lib\ffmpeg\tools'
          $ffmpeg = Get-ChildItem -Path $toolsPath -Filter ffmpeg.exe -File -Recurse |
            Where-Object { $_.FullName -match '[\\/]bin[\\/]ffmpeg\.exe$' } |
            Select-Object -First 1
          $ffprobe = Get-ChildItem -Path $toolsPath -Filter ffprobe.exe -File -Recurse |
            Where-Object { $_.FullName -match '[\\/]bin[\\/]ffprobe\.exe$' } |
            Select-Object -First 1
          if (-not $ffmpeg -or -not $ffprobe) {
            throw "Could not locate FFmpeg and FFprobe executables under $toolsPath"
          }
          "FFMPEG_PATH=$($ffmpeg.FullName)" >> $env:GITHUB_ENV
          "FFPROBE_PATH=$($ffprobe.FullName)" >> $env:GITHUB_ENV

      - name: Prepare Tauri FFmpeg Sidecar Binaries
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "macos" ]; then
            brew install ffmpeg || true
          fi
          node scripts/download-ffmpeg.cjs

      - name: Build Tauri Desktop Application
        uses: tauri-apps/tauri-action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: "./"

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v7
        with:
          name: SambaVault-v${{ steps.ver.outputs.version }}-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          archive: false

  deploy-release:
    name: Create GitHub Release
    needs: build-desktop
    # Only run this step when code is pushed to the main branch
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Determine Version
        id: ver
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download All Installers
        uses: actions/download-artifact@v8
        with:
          pattern: SambaVault-v*
          merge-multiple: true
          path: dist-release/

      - name: Create Release Draft
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: SambaVault v${{ steps.ver.outputs.version }}
          draft: true
          prerelease: false
          files: dist-release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
