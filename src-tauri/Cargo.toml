[package]
name = "media-player-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
# The primary cross-platform UI framework
dioxus = { version = "0.6", features = ["desktop"] } 

# Backend capabilities previously handled by the Tauri layer
rusqlite = { version = "0.31", features = ["bundled"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"