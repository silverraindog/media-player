name: Release Desktop App
on:
  push:
    tags:
      - 'v*'

jobs:
  release-desktop:
    name: Release (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows"
            os: windows-latest
          - platform: "macos"
            os: macos-latest
          - platform: "linux"
            os: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Clean Lockfile for Fresh Cross-Platform Resolution
        shell: bash
        run: rm -f bun.lock bun.lockb yarn.lock pnpm-lock.yaml package-lock.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install System Dependencies (Linux Only)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Frontend Dependencies
        run: npm install --include=optional --force

      - name: Build and Release Desktop App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: "./"
          tagName: ${{ github.ref_name }}
          releaseName: 'SambaVault ${{ github.ref_name }}'
          releaseBody: 'Automated cross-platform desktop release for macOS, Windows, and Linux.'
          releaseDraft: false
          prerelease: false
